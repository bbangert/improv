name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  ELIXIR_VERSION: "1.20.2-otp-29"
  OTP_VERSION: "29.0.3"
  # libmnl-dev: vintage_net (optional dep) NIF; libssl-dev: crypto NIFs.
  APT_PACKAGES: build-essential automake autoconf pkg-config libssl-dev libmnl-dev

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/test
          key: ${{ runner.os }}-test-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-test-
      - run: mix deps.get
      - run: mix test --warnings-as-errors

  compile-format:
    name: Compile · Format
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-compile-format-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-compile-format-
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/dev
            priv/plts
          key: ${{ runner.os }}-dialyzer-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-dialyzer-
      - run: mix deps.get
      - run: mix dialyzer

  credo:
    name: Credo
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-credo-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-credo-
      - run: mix deps.get
      - run: mix credo --strict

  sobelow:
    name: Sobelow
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-sobelow-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-sobelow-
      - run: mix deps.get
      # Not a Phoenix app: Sobelow skips the router checks and runs the rest.
      - run: mix sobelow --skip --exit --threshold medium

  audit:
    name: Hex audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - run: mix deps.get
      # Retired packages and EEF/GHSA security advisories.
      - run: mix hex.audit
      - run: mix deps.unlock --check-unused

  argus:
    name: Argus
    # Souffle's PPA build links libffi7, which Ubuntu 24.04 no longer ships.
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: sudo apt-get update || true; sudo apt-get install -y ${{ env.APT_PACKAGES }}
      - name: Install Souffle
        run: |
          # Souffle's PPA package links against libffi7, which Ubuntu 24.04
          # dropped; install the Ubuntu 20.04 build (checksum-pinned) first.
          curl -fsSLo /tmp/libffi7.deb http://archive.ubuntu.com/ubuntu/pool/main/libf/libffi/libffi7_3.3-4_amd64.deb
          echo "4584aa8fef1bf5086168ce2f7078cd2ebd78fdc4cc0d86d958d795d4e0b0f50d  /tmp/libffi7.deb" | sha256sum -c -
          sudo apt-get install -y /tmp/libffi7.deb
          sudo wget https://souffle-lang.github.io/ppa/souffle-key.public -O /usr/share/keyrings/souffle-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/souffle-archive-keyring.gpg] https://souffle-lang.github.io/ppa/ubuntu/ stable main" | sudo tee /etc/apt/sources.list.d/souffle.list
          sudo apt-get update
          sudo apt-get install -y souffle
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build/dev
          key: ${{ runner.os }}-24.04-argus-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-24.04-argus-
      - run: mix deps.get
      - run: mix argus --fail-above 0
