name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Hex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # libmnl-dev: vintage_net (optional dep) compiles an if_monitor NIF
      # during mix compile; libssl-dev for crypto-using NIFs.
      - run: sudo apt-get update || true; sudo apt-get install -y build-essential pkg-config libssl-dev libmnl-dev

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        id: beam
        with:
          otp-version: "29.0.3"
          elixir-version: "1.20.2-otp-29"

      # Guard against a release tag that doesn't match the package version —
      # mix.exs is the source of truth for what actually gets shipped.
      - name: Verify tag matches mix.exs version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mix_version=$(grep -Po '@version\s+"\K[^"]+' mix.exs)
          if [ "$tag" != "$mix_version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME (${tag}) does not match mix.exs @version ${mix_version}"
            exit 1
          fi

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: mix-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            mix-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get --check-locked
      - run: mix compile --warnings-as-errors
      - run: mix test

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
